services:
  izvoli:
    build:
      context: ./izvoli
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    environment:
      - VITE_API_URL_BASE=https://glas-ljudstva.si/api/v2/volitvomat
    volumes:
      - ./izvoli/public:/app/public
      - ./izvoli/src:/app/src
      - ./izvoli/.prettierrc.json:/app/.prettierrc.json
      - ./izvoli/eslint.config.js:/app/eslint.config.js
      - ./izvoli/index.html:/app/index.html
      - ./izvoli/jsconfig.json:/app/jsconfig.json
      - ./izvoli/vite.config.js:/app/vite.config.js
