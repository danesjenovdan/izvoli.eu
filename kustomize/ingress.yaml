apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: izvoli-si
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - preprosto.izvoli.si
      secretName: izvoli-si-tls
  rules:
    - host: preprosto.izvoli.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: izvoli-si
                port:
                  number: 80
