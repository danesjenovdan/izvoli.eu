apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: izvoli-si
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - izvoli-si.lb.djnd.si
        - izvoli.si
      secretName: izvoli-si-tls
  rules:
    - host: izvoli-si.lb.djnd.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: izvoli-si
                port:
                  number: 80
    - host: izvoli.si
      http: *http_paths
