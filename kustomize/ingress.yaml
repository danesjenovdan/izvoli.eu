apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: default
spec:
  redirectRegex:
    regex: ^https?://www\.(.*)
    replacement: https://$1
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: izvoli-si
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: izvoli-si-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - izvoli.si
        - www.izvoli.si
      secretName: izvoli-si-tls
  rules:
    - host: izvoli.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: izvoli-si
                port:
                  number: 80
