apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: izvoli
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - izvoli.eu
      secretName: izvoli-tls
  rules:
    - host: izvoli.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: izvoli
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: izvoli-nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - files.izvoli.eu
      secretName: izvoli-nginx-tls
  rules:
    - host: files.izvoli.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: izvoli-nginx
                port:
                  number: 80
